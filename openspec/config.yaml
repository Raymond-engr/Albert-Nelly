schema: spec-driven

# Project context
context: |
  Stack: Next.js 16 (App Router), React 19, TypeScript strict, Tailwind CSS v4, Supabase (@supabase/ssr).
  Showroom slots are prop-less and self-contained; copy lives in src/data/.
  Control Room seams in src/lib/control-room/ must preserve existing function signatures.
  Money is stored as whole Naira (bigint in database, number in TypeScript).
  Never put secrets in NEXT_PUBLIC_* variables; SUPABASE_SECRET_KEY is server-only.
  Deliver changes as clean, reversible .patch files adhering to docs/CONTROL_ROOM_HANDOVER.md and CLAUDE.md.
  Always generate commit messages at the end of a task.

# Per-artifact rules
rules:
  proposal:
    - Clearly define scope and reference relevant phase in docs/CONTROL_ROOM_HANDOVER.md
    - Detail impact on public Showroom vs Control Room vs Database
  tasks:
    - Structure tasks sequentially with acceptance checks
    - Include typecheck, lint, and build validation steps
